# Roboelectric Configuration for Compose UI Tests
# Allows running Compose UI unit tests without Android device/emulator

# Target Android SDK version (Roboelectric 4.13 supports up to API 35)
sdk=35

# Use newer shadows implementation
useDefaultCompressedAssets=true

# Enable proper resource handling
useStubResources=false

# Logging level
logging=warn

# Runtime behavior
useMergedManifests=true
