# Roboelectric Configuration
# Android SDK version to target
# NOTE: Using 34 because Roboelectric 4.x doesn't support SDK 37 yet
# Actual compileSdk is 37 but we use 34 for test compatibility
sdk=34

# Manifest location
manifest=src/main/AndroidManifest.xml

# Resources directory
resourceDir=src/main/res

# Assets directory
assetDir=src/main/assets
