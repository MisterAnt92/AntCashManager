<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="192"
     height="192"
     viewBox="0 0 192 192">

  <!-- Background circle with pink gradient -->
  <circle cx="96" cy="96" r="96" fill="#FFE0E6"/>

  <!-- Subtle gradient overlay -->
  <circle cx="96" cy="96" r="80" fill="#FFF0F3" opacity="0.4"/>

  <!-- Piggy Bank Body -->
  <ellipse cx="96" cy="104" rx="48" ry="34" fill="#FFB3BA" stroke="#FF8A95" stroke-width="3"/>

  <!-- Snout -->
  <ellipse cx="96" cy="92" rx="13" ry="9" fill="#FF8A95"/>

  <!-- Nostrils -->
  <circle cx="90" cy="92" r="2.5" fill="#E91E63"/>
  <circle cx="102" cy="92" r="2.5" fill="#E91E63"/>

  <!-- Eyes -->
  <circle cx="80" cy="82" r="6.5" fill="#FFFFFF"/>
  <circle cx="112" cy="82" r="6.5" fill="#FFFFFF"/>

  <!-- Pupils -->
  <circle cx="80" cy="82" r="3.2" fill="#2E2E2E"/>
  <circle cx="112" cy="82" r="3.2" fill="#2E2E2E"/>

  <!-- Eye highlights -->
  <circle cx="81.2" cy="80.4" r="1.2" fill="#FFFFFF"/>
  <circle cx="113.2" cy="80.4" r="1.2" fill="#FFFFFF"/>

  <!-- Ears -->
  <path d="M68,74 Q60,60 68,52 Q74,60 68,74Z" fill="#FFB3BA"/>
  <path d="M124,74 Q130,60 124,52 Q118,60 124,74Z" fill="#FFB3BA"/>

  <!-- Inner ears -->
  <path d="M68,70 Q64,64 68,58 Q71,64 68,70Z" fill="#FF8A95"/>
  <path d="M124,70 Q128,64 124,58 Q121,64 124,70Z" fill="#FF8A95"/>

  <!-- Legs -->
  <ellipse cx="72" cy="128" rx="7" ry="12" fill="#FF8A95"/>
  <ellipse cx="120" cy="128" rx="7" ry="12" fill="#FF8A95"/>

  <!-- Tail -->
  <path d="M140,104 Q150,96 150,80 Q144,72 136,80 Q140,88 140,104"
        fill="none" stroke="#FF8A95" stroke-width="5" stroke-linecap="round"/>

  <!-- Coin slot -->
  <rect x="93" y="66" width="6" height="12" rx="3" fill="#E91E63"/>

  <!-- Coin -->
  <circle cx="96" cy="48" r="9" fill="#FFD54F"/>
  <circle cx="96" cy="48" r="6" fill="#FFC107"/>

  <!-- Euro sign on coin -->
  <path d="M98,42 Q96,40 94,42 Q93,48 94,54 Q96,56 98,54 M92,46 L100,46 M92,50 L100,50"
        fill="none" stroke="#FF6F00" stroke-width="1.2"/>

  <!-- Small sparkle -->
  <path d="M124,36 L125.6,39 L128.6,37.6 L125.6,41.2 L124,44.2 L122.4,41.2 L119.4,37.6 L122.4,39 Z"
        fill="#FFD54F"/>

</svg>

