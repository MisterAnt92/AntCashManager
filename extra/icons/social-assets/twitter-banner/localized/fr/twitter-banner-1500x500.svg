<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1500"
     height="500"
     viewBox="0 0 1500 500">

  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE0E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD0DB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#gradientBg)"/>

  <!-- Left section: App branding -->
  <g>
    <!-- Background shape -->
    <rect x="0" y="0" width="700" height="500" fill="#FFFFFF" opacity="0.95"/>

    <!-- App Icon -->
    <g transform="translate(150, 80) scale(1.2)">
      <!-- Background circle -->
      <circle cx="64" cy="64" r="64" fill="#FFB3BA"/>

      <!-- Piggy Bank Body -->
      <ellipse cx="64" cy="72" rx="40" ry="27" fill="#FFB3BA" stroke="#FF8A95" stroke-width="2.5"/>

      <!-- Snout -->
      <ellipse cx="64" cy="58" rx="11" ry="7.5" fill="#FF8A95"/>

      <!-- Eyes -->
      <circle cx="52" cy="50" r="5" fill="#FFFFFF"/>
      <circle cx="76" cy="50" r="5" fill="#FFFFFF"/>
      <circle cx="52" cy="50" r="2.5" fill="#2E2E2E"/>
      <circle cx="76" cy="50" r="2.5" fill="#2E2E2E"/>

      <!-- Coin -->
      <circle cx="64" cy="32" r="6" fill="#FFD54F"/>
    </g>

    <!-- Text -->
    <text x="420" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FF8A95">
      AntCash
    </text>
    <text x="420" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#E91E63">
      Manager
    </text>

    <text x="420" y="330" font-family="Arial, sans-serif" font-size="32" fill="#666666">
      Finance intelligente
    </text>

    <text x="420" y="420" font-family="Arial, sans-serif" font-size="24" fill="#999999">
      Telechargez sur Google Play
    </text>
  </g>

  <!-- Right section: Features -->
  <g transform="translate(750, 0)">
    <rect width="750" height="500" fill="#FFF0F3" opacity="0.5"/>

    <!-- Feature icons and text -->
    <g transform="translate(50, 50)">
      <text font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FF8A95">
        Fonctionnalites
      </text>

      <!-- Feature 1 -->
      <g transform="translate(0, 80)">
        <circle cx="0" cy="0" r="30" fill="#FFB3BA" opacity="0.3"/>
        <text x="60" y="10" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF8A95">Transactions</text>
        <text x="60" y="40" font-family="Arial, sans-serif" font-size="16" fill="#666666">Gerez revenus et depenses</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 180)">
        <circle cx="0" cy="0" r="30" fill="#FFB3BA" opacity="0.3"/>
        <text x="60" y="10" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF8A95">Graphiques</text>
        <text x="60" y="40" font-family="Arial, sans-serif" font-size="16" fill="#666666">Analysez vos depenses</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 280)">
        <circle cx="0" cy="0" r="30" fill="#FFB3BA" opacity="0.3"/>
        <text x="60" y="10" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF8A95">Sauvegarde</text>
        <text x="60" y="40" font-family="Arial, sans-serif" font-size="16" fill="#666666">Donnees toujours securisees</text>
      </g>
    </g>
  </g>

</svg>

