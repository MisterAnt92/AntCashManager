<?xml version="1.0" encoding="UTF-8"?>
<svg height="500" viewBox="0 0 1500 500" width="1500" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="gradientBg" x1="0%" x2="100%" y1="0%" y2="100%">
            <stop style="stop-color:#FFE0E6;stop-opacity:1" offset="0%" />
            <stop style="stop-color:#FFD0DB;stop-opacity:1" offset="100%" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect fill="url(#gradientBg)" height="500" width="1500" />

    <!-- Left section: App branding -->
    <g>
        <!-- Background shape -->
        <rect fill="#FFFFFF" height="500" opacity="0.95" width="700" x="0" y="0" />

        <!-- App Icon -->
        <g transform="translate(150, 80) scale(1.2)">
            <!-- Background circle -->
            <circle cx="64" cy="64" fill="#FFB3BA" r="64" />

            <!-- Piggy Bank Body -->
            <ellipse cx="64" cy="72" fill="#FFB3BA" rx="40" ry="27" stroke="#FF8A95"
                stroke-width="2.5" />

            <!-- Snout -->
            <ellipse cx="64" cy="58" fill="#FF8A95" rx="11" ry="7.5" />

            <!-- Eyes -->
            <circle cx="52" cy="50" fill="#FFFFFF" r="5" />
            <circle cx="76" cy="50" fill="#FFFFFF" r="5" />
            <circle cx="52" cy="50" fill="#2E2E2E" r="2.5" />
            <circle cx="76" cy="50" fill="#2E2E2E" r="2.5" />

            <!-- Coin -->
            <circle cx="64" cy="32" fill="#FFD54F" r="6" />
        </g>

        <!-- Text -->
        <text fill="#FF8A95" font-family="Arial, sans-serif" font-size="72" font-weight="bold" x="420"
            y="180">
            AntCash
        </text>
        <text fill="#E91E63" font-family="Arial, sans-serif" font-size="72" font-weight="bold" x="420"
            y="250">
            Manager
        </text>

        <text fill="#666666" font-family="Arial, sans-serif" font-size="32" x="420" y="330">
            Finanze intelligenti
        </text>

        <text fill="#999999" font-family="Arial, sans-serif" font-size="24" x="420" y="420">
            Scarica ora su Google Play
        </text>
    </g>

    <!-- Right section: Features -->
    <g transform="translate(750, 0)">
        <rect fill="#FFF0F3" height="500" opacity="0.5" width="750" />

        <!-- Feature icons and text -->
        <g transform="translate(50, 50)">
            <text fill="#FF8A95" font-family="Arial, sans-serif" font-size="32" font-weight="bold">
                Funzionalita
            </text>

            <!-- Feature 1 -->
            <g transform="translate(0, 80)">
                <circle cx="0" cy="0" fill="#FFB3BA" opacity="0.3" r="30" />
                <text fill="#FF8A95" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                    x="60" y="10">Transazioni
                </text>
                <text fill="#666666" font-family="Arial, sans-serif" font-size="16" x="60" y="40">
                    Gestisci entrate e uscite
                </text>
            </g>

            <!-- Feature 2 -->
            <g transform="translate(0, 180)">
                <circle cx="0" cy="0" fill="#FFB3BA" opacity="0.3" r="30" />
                <text fill="#FF8A95" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                    x="60" y="10">Grafici
                </text>
                <text fill="#666666" font-family="Arial, sans-serif" font-size="16" x="60" y="40">
                    Analizza le tue spese
                </text>
            </g>

            <!-- Feature 3 -->
            <g transform="translate(0, 280)">
                <circle cx="0" cy="0" fill="#FFB3BA" opacity="0.3" r="30" />
                <text fill="#FF8A95" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                    x="60" y="10">Backup
                </text>
                <text fill="#666666" font-family="Arial, sans-serif" font-size="16" x="60" y="40">
                    Dati sempre al sicuro
                </text>
            </g>
        </g>
    </g>

</svg>

