<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="180"
     height="120"
     viewBox="0 0 180 120">

  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE0E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD0DB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="120" fill="url(#gradientBg)"/>

  <!-- Left: App Icon (scaled down) -->
  <g transform="translate(25, 20) scale(0.35)">
    <!-- Background circle -->
    <circle cx="64" cy="64" r="64" fill="#FFB3BA" opacity="0.8"/>

    <!-- Piggy Bank Body -->
    <ellipse cx="64" cy="72" rx="40" ry="27" fill="#FFB3BA" stroke="#FF8A95" stroke-width="2.5"/>

    <!-- Snout -->
    <ellipse cx="64" cy="58" rx="11" ry="7.5" fill="#FF8A95"/>

    <!-- Eyes -->
    <circle cx="52" cy="50" r="5" fill="#FFFFFF"/>
    <circle cx="76" cy="50" r="5" fill="#FFFFFF"/>
    <circle cx="52" cy="50" r="2.5" fill="#2E2E2E"/>
    <circle cx="76" cy="50" r="2.5" fill="#2E2E2E"/>

    <!-- Coin -->
    <circle cx="64" cy="32" r="6" fill="#FFD54F"/>
  </g>

  <!-- Right: Text -->
  <g>
    <!-- App Name -->
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FF8A95">
      AntCash
    </text>
    <text x="90" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#E91E63">
      Manager
    </text>

    <!-- Tagline -->
    <text x="90" y="75" font-family="Arial, sans-serif" font-size="11" fill="#666666">
      Gestion Financiere
    </text>
    <text x="90" y="88" font-family="Arial, sans-serif" font-size="11" fill="#666666">
      Intelligente
    </text>

    <!-- Rating/Version (optional) -->
    <text x="90" y="105" font-family="Arial, sans-serif" font-size="8" fill="#999999">
      v1.4.6 • Gratuit
    </text>
  </g>

</svg>

