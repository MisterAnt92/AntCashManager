# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Settings specified in this file will override any Gradle settings
# configured through the IDE.
# AndroidX package structure to make it clearer which packages are bundled
# with the Android operating system, and which are packaged with your app's APK.
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for each library.
# NOTE: Deprecated in AGP 8.7+. AGP now handles this automatically.
# android.nonTransitiveRClass=true
# JVM arguments for the Gradle daemon
# Increased to 4GB for Kotlin 2.3.21 + KMP compilation overhead
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Build Parallelism
# Enable parallel execution of tasks within a single project build
org.gradle.parallel=true
# Maximum number of workers for parallel builds (half of available processors)
org.gradle.workers.max=8

# Build Cache
# Enable Gradle build cache for faster incremental builds
org.gradle.caching=true

# Kotlin Compilation Optimization
# Enable incremental compilation for faster rebuild
kotlin.incremental=true
# Note: kotlin.incremental.useClasspathSnapshot is deprecated as of Kotlin 2.0+
# The Kotlin Gradle plugin now uses ABI-based snapshots automatically

# Warnings
# Show all warnings for better build quality
org.gradle.warning.mode=all

# Android Optimization
# Suppress KMP Android source set layout warning (using V2 layout)
kotlin.mpp.androidSourceSetLayoutV2AndroidStyleDirs.nowarn=true


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Gradle 10 Compatibility
# Suppress Project object as dependency notation deprecation warning
# (we use project(String) notation which is the correct approach)
org.gradle.configuration-cache=true
# Report warnings verbosely to track issues
# (can be set to summary, quiet, etc. as needed)
org.gradle.warning.mode=all
